[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technical-knowledge-assistant"
author = "Hasan Yildiz"
version = "0.1.0"
description = "A grounded LangChain technical knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
[project.scripts]
rag-assistant = "technical_knowledge_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/technical_knowledge_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]